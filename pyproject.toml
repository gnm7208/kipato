[tool.ruff]
line-length = 100
target-version = "py311"
# Alembic writes these; keeping them verbatim makes future migrations reviewable.
extend-exclude = ["**/migrations/versions/**"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=server --cov-report=term-missing"

services:
  - type: web
    name: kipato-backend
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r ../requirements.txt
    startCommand: flask db upgrade && python seed_roles.py && gunicorn app:create_app() --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: FLASK_APP
        value: app.py
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kipato-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "false"
      - key: FRONTEND_ORIGINS
        sync: false

databases:
  - name: kipato-db
    plan: free

name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]

jobs:
  backend:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    env:
      FLASK_ENV: testing
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt ruff

      # From the repo root: `server` has to be importable, and this also covers
      # the Vercel entry point in api/.
      - name: Lint (ruff)
        run: ruff check .

      - name: Run tests with coverage
        run: python -m pytest -v

  frontend:
    name: Frontend lint + typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Run tests
        run: npm test

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt
